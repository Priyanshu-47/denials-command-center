server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Gzip the only things worth gzipping — the JS bundle is 171 kB raw.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # -----------------------------------------------------------------
    # The API. Every credential the app holds is sent in an Authorization
    # header, so it must not leave this origin: the browser has exactly
    # one host to talk to and no way to be told to talk to another.
    # -----------------------------------------------------------------
    location /api/ {
        proxy_pass              http://api:8080;
        proxy_http_version      1.1;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;

        # Bulk drafting walks the whole open book through a model; 60s is the
        # model's own default and this must not be the thing that gives up first.
        proxy_read_timeout      180s;
        proxy_send_timeout      180s;

        # A draft request that is retried after a timeout must not be able to
        # turn into two requests server-side; the API de-duplicates anyway,
        # but nginx should not be the one inventing the retry.
        proxy_next_upstream     off;
    }

    location = /health {
        proxy_pass http://api:8080/health;
    }

    # Single-page app: a reload on any path serves the shell. There is no
    # router in this app, so this is belt-and-braces rather than routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The bundle is content-hashed by vite, so it can be cached hard; the
    # shell must not be, or a deploy would keep serving the old asset name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
